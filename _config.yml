locale                   : "en-US"
title                    : "Haoyun Zhang"
title_separator          : "·"
name                     : "Haoyun Zhang"
description              : &description "Biomedical engineer developing reliable and interpretable machine learning for clinical and biological data."
url                      : "https://haoyunzhang2003.github.io"
baseurl                  : ""
repository               : "HaoyunZhang2003/HaoyunZhang2003.github.io"

author:
  avatar           : "haoyun-portrait.png"
  name             : "Haoyun Zhang"
  bio              : "M.S. Student in Biomedical Engineering"
  location         : "Ann Arbor, Michigan"
  employer         : "University of Michigan"
  email            : "haoyunzh@umich.edu"
  googlescholar    : "https://scholar.google.com/citations?user=cYJ8e80AAAAJ"
  github           : "HaoyunZhang2003"
  linkedin         : "haoyun-zhang-1278622bb"

teaser                   :
breadcrumbs              : false
words_per_minute         : 160
future                   : true
read_more                : "disabled"
talkmap_link             : false

comments:
  provider               :

atom_feed:
  hide                   : true

analytics:
  provider               : false

include:
  - .htaccess
  - _pages
  - files

exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - .scratch-ppt
  - .template
  - .tools
  - CHANGELOG
  - Capfile
  - Gemfile
  - Gruntfile.js
  - LICENSE
  - README
  - Rakefile
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - config
  - gulpfile.js
  - log
  - markdown_generator
  - node_modules
  - package.json
  - talkmap
  - tmp
  - vendor

keep_files:
  - .git
  - .svn

encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

collections:
  teaching:
    output: true
    permalink: /:collection/:path/
  publications:
    output: true
    permalink: /:collection/:path/
  portfolio:
    output: true
    permalink: /:collection/:path/
  talks:
    output: true
    permalink: /:collection/:path/

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true

sass:
  sass_dir: _sass
  style: compressed

permalink: /:categories/:title/
timezone: America/Detroit

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-redirect-from

whitelist:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji

compress_html:
  clippings: all
  ignore:
    envs: development
